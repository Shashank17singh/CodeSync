[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codesync-executor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docker==7.2.0",
  "pydantic==2.14.2",
  "redis==8.1.0",
  "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: needs a real Docker daemon and the sandbox images",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S108"]
