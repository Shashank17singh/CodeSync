worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # The application rate limits per user. This is the outer wall against raw request floods.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=sockets:10m;

  upstream api {
    server api:3000;
  }

  upstream collab {
    # Connections from one client stay on one instance for the life of the socket.
    least_conn;
    server collab:4000;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Monaco injects inline styles and starts workers from blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Worker callbacks use a service token and must never be reachable from outside.
    location /api/v1/internal/ {
      return 404;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collab/ {
      limit_conn sockets 20;
      proxy_pass http://collab;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      # Longer than the server's 15 second heartbeat, so idle editors are not cut off.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      # The token is in the query string, so this path must stay out of the access log.
      access_log off;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
